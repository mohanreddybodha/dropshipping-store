<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Squircle background -->
  <rect x="42" y="42" width="940" height="940" rx="210" ry="210" fill="#ffffff"/>

  <!-- Cart handle arc -->
  <path d="M 340 480 C 340 310 420 240 512 240 C 604 240 684 310 684 480"
        stroke="#059669" stroke-width="72" stroke-linecap="round" fill="none"/>

  <!-- Cart body -->
  <rect x="270" y="460" width="484" height="310" rx="52" fill="#10b981"/>

  <!-- Top rim -->
  <rect x="250" y="450" width="524" height="80" rx="40" fill="#059669"/>

  <!-- Item slots -->
  <rect x="315" y="560" width="110" height="150" rx="20" fill="white" fill-opacity="0.22"/>
  <rect x="457" y="560" width="110" height="150" rx="20" fill="white" fill-opacity="0.22"/>
  <rect x="599" y="560" width="110" height="150" rx="20" fill="white" fill-opacity="0.22"/>

  <!-- Left wheel -->
  <circle cx="358" cy="800" r="72" fill="#064e3b"/>
  <circle cx="358" cy="800" r="36" fill="#10b981"/>
  <circle cx="358" cy="800" r="14" fill="#064e3b"/>

  <!-- Right wheel -->
  <circle cx="666" cy="800" r="72" fill="#064e3b"/>
  <circle cx="666" cy="800" r="36" fill="#10b981"/>
  <circle cx="666" cy="800" r="14" fill="#064e3b"/>

  <!-- Squircle border -->
  <rect x="42" y="42" width="940" height="940" rx="210" ry="210" fill="none" stroke="#E2E8F0" stroke-width="6"/>
</svg>
