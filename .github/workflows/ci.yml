name: CI/CD Pipeline & Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Test Suite (Pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Data Directory
        run: mkdir -p data

      - name: Run Pytest Suite with Security & DLQ Checks
        env:
          DATABASE_URL: "sqlite:///data/test.db"
          ADMIN_API_KEY: "ci_admin_secret_key_verification_998877"
          WEBHOOK_SECRET: "ci_webhook_secret_key_verification_998877"
          CJ_API_KEY: "mock_ci_cj_key"
        run: |
          pytest -v tests/

  frontend-build:
    name: Storefront Next.js Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: storefront/package-lock.json

      - name: Install Storefront Dependencies
        working-directory: ./storefront
        run: npm ci

      - name: Build Next.js 15 Storefront
        working-directory: ./storefront
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000/api"
        run: npm run build
