name: CI/CD Pipeline & Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Test Suite (Pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Data Directory
        run: mkdir -p data

      - name: Run Pytest Suite with Security & DLQ Checks
        env:
          DATABASE_URL: "sqlite:///data/test.db"
          ADMIN_API_KEY: "ci_admin_secret_key_verification_998877"
          WEBHOOK_SECRET: "ci_webhook_secret_key_verification_998877"
          CJ_API_KEY: "mock_ci_cj_key"
        run: |
          pytest -v tests/

  storefront-quality-gate:
    name: Storefront Next.js Build & Production Security Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: storefront/package-lock.json

      - name: Install Storefront Dependencies
        working-directory: ./storefront
        run: npm ci

      - name: Build Next.js 15 Storefront
        working-directory: ./storefront
        env:
          NEXT_PUBLIC_API_URL: "/api"
          ADMIN_API_KEY: "ci_admin_secret_key_verification_998877"
          CRON_SECRET: "ci_cron_secret_verification_998877"
        run: npm run build

      - name: Start Production Server and Execute Security Verification
        working-directory: ./storefront
        env:
          PORT: 3009
          ADMIN_API_KEY: "ci_admin_secret_key_verification_998877"
          CRON_SECRET: "ci_cron_secret_verification_998877"
        run: |
          npx next start -p 3009 &
          SERVER_PID=$!
          echo "Waiting for Next.js production server on port 3009..."
          for i in {1..30}; do
            if curl -s http://localhost:3009 > /dev/null; then
              echo "Server is ready!"
              break
            fi
            sleep 1
          done
          npm run test:production
          kill $SERVER_PID
